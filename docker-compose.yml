services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-demo-pgvector
    environment:
      POSTGRES_DB: ragdemo
      POSTGRES_USER: ragdemo
      POSTGRES_PASSWORD: ragdemo
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdemo -d ragdemo"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: rag-demo-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-models:
    image: ollama/ollama:latest
    container_name: rag-demo-ollama-models
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.2:1b &&
       ollama pull nomic-embed-text"
    restart: "no"

volumes:
  pgvector-data:
  ollama-data:
