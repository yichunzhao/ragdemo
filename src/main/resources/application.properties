spring.application.name=rag demo

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Vector Store Configuration
# This demo uses Spring AI's SimpleVectorStore, configured in VectorStoreConfig.
# It is in-memory and does not require Docker or an external vector database.

# Server Configuration
server.port=8080

# Logging
logging.level.com.ynz.ai.rag.ragdemo=DEBUG
logging.level.org.springframework.ai=INFO

# Allow bean definition overriding to resolve duplicate bean error
spring.main.allow-bean-definition-overriding=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Spring MVC path matching
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
