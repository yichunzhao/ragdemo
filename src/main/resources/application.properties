spring.application.name=rag demo

# Ollama Configuration
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.chat.temperature=0.7
spring.ai.ollama.embedding.model=nomic-embed-text

# PostgreSQL / PgVector Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdemo
spring.datasource.username=ragdemo
spring.datasource.password=ragdemo
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.table-name=vector_store

# Server Configuration
server.port=8080

# Logging
logging.level.com.ynz.ai.rag.ragdemo=DEBUG
logging.level.org.springframework.ai=INFO

# Allow bean definition overriding to resolve duplicate bean error
spring.main.allow-bean-definition-overriding=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Spring MVC path matching
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Docker Compose integration
spring.docker.compose.lifecycle-management=start-only

# Interactive shell
spring.shell.interactive.enabled=true
spring.shell.noninteractive.enabled=false
